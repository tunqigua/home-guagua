<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>HOME · 卡片验收</title><style>body{background:#f5f1e8;font:16px sans-serif;padding:20px}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}img{width:100%}pre{white-space:pre-wrap}</style><h1>八种卡片实际导出检查</h1><pre id="status">正在生成…</pre><div id="cards"></div><script type="module">
import {rooms} from '../dist/data.js';import {createCard} from '../dist/card.js';
const checks=[];for(const t of Object.keys(rooms)){try{const {blob,width,height,textEnd}=await createCard(t);if(blob.type!=='image/png'||blob.size<1000||textEnd>height-40)throw Error('尺寸或内容异常');const img=new Image();img.src=URL.createObjectURL(blob);img.alt=rooms[t].name;img.title=rooms[t].name;await img.decode();if(img.naturalWidth!==1080||img.naturalHeight!==height)throw Error('图片尺寸异常');document.querySelector('#cards').append(img);checks.push(`${rooms[t].name}：通过，${width} × ${height}，${blob.size} 字节，文字底部 ${textEnd}`);}catch(e){checks.push(t+'：失败 '+e.message)}}document.querySelector('#status').textContent=checks.join('\n');
</script></html>
