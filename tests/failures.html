<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>厚雪异常验收</title><h1>厚雪异常验收</h1><pre id="status">运行中…</pre><iframe id="frame" style="width:320px;height:680px"></iframe><script type="module">
