<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><title>HOME · 四语言验收</title><style>body{font:14px/1.65 system-ui;background:#eaf1f4;color:#293740;padding:20px}pre{white-space:pre-wrap}iframe{width:320px;height:812px;border:1px solid #ccc}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}img{width:100%}figure{margin:0}figcaption{font-size:12px}</style><h1>HOME · 四语言验收</h1><pre id="status">正在检查…</pre><iframe id="frame"></iframe><div id="cards"></div><script type="module">
import {questions,rooms} from '../dist/data.js';
import {catalog,tr,languages,LANGUAGE_KEY} from '../dist/i18n.js';
import {SESSION_KEY,defaultConfig,roomURL} from '../dist/logic.js';
import {createCard} from '../dist/card.js';
const frame=document.querySelector('#frame'),out=document.querySelector('#status'),reports=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(v,m)=>{if(!v)throw Error(m);};
const record=t=>{reports.push('✓ '+t);out.textContent=reports.join('\n');};
let seq=0;
async function load(lang='',hash=''){frame.src='./scenario.html?mode=empty&run='+(++seq)+(lang?'&lang='+lang:'')+hash;await new Promise(r=>frame.onload=r);for(let i=0;i<100&&!frame.contentWindow.__qa?.ready;i++)await sleep(20);const w=frame.contentWindow;assert(w.__qa?.ready,'fixture ready');return w;}
const text=(s,lang)=>tr(s,{},lang);
const button=(w,s,lang)=>[...w.document.querySelectorAll('button')].find(n=>n.textContent===text(s,lang));
const stored=w=>w.sessionStorage.getItem(SESSION_KEY);
const switchTo=(w,lang)=>{const n=w.document.querySelector('#language');n.value=lang;n.dispatchEvent(new w.Event('change'));};
const answer=async(w,id)=>{w.document.querySelector(`[data-answer="${id}"]`).click();await sleep(550);};
const checkEnglish=w=>{const walker=w.document.createTreeWalker(w.document.body,w.NodeFilter.SHOW_TEXT);let n;while((n=walker.nextNode())){if(n.parentElement.closest('select#language,script,style'))continue;assert(!/[\u3400-\u9fff]/u.test(n.textContent), 'Untranslated English: '+n.textContent);}};
try{
 for(const preference of ['', 'invalid', 'zh-CN']){const w=await load(preference);assert(w.document.documentElement.lang==='zh-Hans','first visit or invalid preference');}record('首次与无效偏好固定使用简体中文');
 let w=await load();
 for(const lang of Object.keys(languages)){
  const node=w.document.querySelector('#app').firstChild;switchTo(w,lang);assert(w.document.documentElement.lang===lang,'html language');assert(w.document.querySelector('#app').firstChild===node,'home node retained');assert(w.localStorage.getItem(LANGUAGE_KEY)===lang,'local preference');assert(w.document.title===text('HOME · 挂挂在窗边等你',lang),'title');
  assert(w.document.querySelector('.home-title').textContent==='HOME'&&!w.document.querySelector('.home-title br'),'single HOME heading');
  assert(w.document.querySelector('.home-description').textContent===text('8 个小选择，找到你该住哪里。',lang),'exact subtitle');
  assert(w.document.querySelector('.home-companion').textContent===text('小猫挂挂在窗边等你。',lang),'exact companion');
  assert(!w.document.querySelector('.intro .eyebrow,.meta,.resume-note,.previews,.preview-label,.header-note'),'removed nodes absent');
  assert(w.document.querySelector('.home-description').nextElementSibling.className==='home-companion'&&w.document.querySelector('.home-companion').nextElementSibling.matches('img.scene'),'copy order');
  assert(!w.document.body.innerText.includes('瓜瓜'),'old name absent');
  for(const width of [320,375,390,768,1280]){frame.style.width=width+'px';await sleep(25);assert(w.document.documentElement.scrollWidth===width,'home no overflow '+lang+' '+width);}
  frame.style.width='320px';
  assert(w.document.querySelector('.privacy').textContent.includes(text('语言选择只保存在当前浏览器，不上传，也不与答题记录关联。首次打开默认简体中文；读取失败或标识无效时也使用简体中文。',lang)),'privacy translated');
  if(lang==='en')checkEnglish(w);
 }record('四语言首页、标题、隐私即时更新；保留 DOM 与独立本地偏好');
 frame.src='../dist/';await new Promise(r=>frame.onload=r);w=frame.contentWindow;assert(w.document.documentElement.lang==='en','local preference on reopen');record('重新打开优先读取用户的语言选择');
 w=await load();w.document.querySelector('.intro>.primary').click();await sleep(50);await answer(w,'A');
 const before=stored(w),quiz=w.document.querySelector('.quiz'),cat=w.document.querySelector('.companion'),idle=[...w.__qa.idle.keys()].join(',');
 w.__qa.fireIdle();assert(cat.classList.contains('playing'),'yarn playing');const catSVG=cat.firstElementChild;
 for(const lang of Object.keys(languages)){
  const writes=w.__qa.writes.length;switchTo(w,lang);assert(stored(w)===before,'answers/index unchanged');assert(w.document.querySelector('.quiz')===quiz,'quiz retained');assert(cat.firstElementChild===catSVG&&cat.classList.contains('playing'),'cat animation not restarted');assert(w.document.querySelector('h1').textContent===text(questions[1].title,lang),'current question translated');assert([...w.document.querySelectorAll('.option-text')].length===4,'options visible');questions[1].options.forEach((o,i)=>assert(w.document.querySelectorAll('.option-text')[i].textContent===text(o.label,lang),'option translated'));assert(w.__qa.writes.slice(writes).every(x=>x.key===LANGUAGE_KEY&&x.storage==='local'),'only language preference written');
 }record('答题中切换保留题号和答案；挂挂毛球节点与动画不重建；只写语言偏好');
 for(let i=1;i<7;i++)await answer(w,'A');w.document.querySelector('[data-answer="D"]').click();await sleep(240);
 const snow=w.document.querySelector('.snow-layer'),scene=w.document.querySelector('.scene');assert(snow,'completion reveals snow');switchTo(w,'ja');assert(w.document.querySelector('.snow-layer')===snow,'snow retained during switch');await sleep(1500);assert(!w.document.querySelector('.snow-layer'),'snow completes');
 button(w,'壁炉橘光','ja').click();button(w,'灰绿色','ja').click();const select=w.document.querySelector('.slots select');select.value='books';select.dispatchEvent(new w.Event('change'));const own=JSON.parse(stored(w)).own;button(w,rooms[own.config.type].plaques[2],'ja').click();
 const config=JSON.parse(stored(w)).own.config,snapshot=stored(w),sceneSrc=scene.src;
 for(const lang of Object.keys(languages)){
  switchTo(w,lang);assert(stored(w)===snapshot,'room unchanged');assert(w.document.querySelector('.scene')===scene&&scene.src===sceneSrc,'scene retained');assert(!w.document.querySelector('.snow-layer'),'no snow replay');assert(w.document.querySelector('.door-plaque').textContent==='「'+text(rooms[config.type].plaques[2],lang)+'」','same plaque ID translated');
  assert(w.document.querySelector('.dressing h2').textContent===text('这就是你的家，请肆意装扮。',lang),'welcome exact');
  for(const width of [320,375,768]){frame.style.width=width+'px';await sleep(25);assert(w.document.documentElement.scrollWidth===width,'no overflow '+lang+' '+width);}
  frame.style.width='320px';if(lang==='en')checkEnglish(w);
 }record('四语言结果、装扮、门牌 ID 和场景保持一致；落雪不重播；320/375/768px 无溢出');
 for(const lang of Object.keys(languages)){
  switchTo(w,lang);button(w,'把小屋发给朋友',lang).click();await sleep(30);assert(w.__qa.copies.at(-1)===roomURL(config,w.location.href),'share snapshot language independent');
  button(w,'保存我的小屋',lang).click();for(let i=0;i<100&&!w.document.querySelector('dialog').open;i++)await sleep(30);
  assert(w.document.querySelector('dialog').open,'poster modal '+lang);assert(w.document.querySelector('dialog h2').textContent===text('把这间小屋留在身边',lang),'poster text');assert(w.document.querySelector('dialog a').download.startsWith('HOME-'),'poster brand');w.document.querySelector('dialog .close').click();
  assert(w.document.querySelector('.support'),'support enabled');button(w,'请一杯热可可',lang).click();assert(w.document.querySelector('.support-amounts').textContent===text('1 元、3 元、6 元，或者你喜欢的金额，都很好。',lang),'actual currency');assert(w.document.querySelector('dialog').textContent.includes('CNY'),'CNY specified');
  button(w,'看看挂挂的感谢',lang).click();const thanks=w.document.querySelector('.thanks-scene');const thanksSVG=thanks.firstElementChild;switchTo(w,lang==='en'?'ja':'en');assert(thanks.firstElementChild===thanksSVG,'thanks animation retained');w.document.querySelector('dialog .close').click();
 }record('四语言分享快照、海报弹层、赞赏金额 CNY 和感谢动画通过');
 const url=roomURL(config,w.location.href);w.location.hash=new URL(url).hash;await sleep(50);switchTo(w,'en');assert(w.document.querySelector('.door-plaque').textContent==='「'+text(rooms[config.type].plaques[2],'en')+'」','visitor language applies to same snapshot');assert(!w.document.querySelector('.snow-layer'),'shared no snow');assert(w.__qa.network.length===0,'no uploads');assert(w.__qa.errors.length===0,'no runtime errors');record('访客按自己的语言展示同一配置；无 fetch/XHR/beacon 上传或运行错误');
 w=await load('en','#/room/v1/charging');assert(w.document.querySelector('h1').textContent===text(rooms.charging.name,'en'),'legacy sharing');record('旧版分享链接仍可使用');
 for(const lang of Object.keys(languages))for(const type of Object.keys(rooms)){
  const {blob,width,height,textEnd}=await createCard({...defaultConfig(type),plaque:2},lang);assert(blob.type==='image/png'&&width===1080&&height>=1440&&textEnd<height-40,'card bounds');const figure=document.createElement('figure'),img=new Image();img.src=URL.createObjectURL(blob);img.alt=lang+' '+type;await img.decode();assert(img.naturalHeight===height,'decode');const caption=document.createElement('figcaption');caption.textContent=lang+' · '+text(rooms[type].name,lang)+' · '+width+'×'+height;figure.append(img,caption);document.querySelector('#cards').append(figure);
 }record('32 张海报实际生成并解码；自然换行，画布按文字高度扩展');
 out.dataset.result='passed';record('全部四语言验收通过');
}catch(e){out.dataset.result='failed';out.textContent+='\n✗ '+e.stack;}
</script></html>
