<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><title>HOME · 分享预览生成</title><style>img{width:600px;max-width:100%;display:block}a{display:block;margin:16px}</style><div id="previews"></div><script type="module">
import {sceneURI} from '../dist/scene.js';
import {defaultConfig} from '../dist/logic.js';

import {wrapLines} from '../dist/card.js';
const image=new Image();image.src=sceneURI(defaultConfig('cinema','tableware'));await image.decode();
for(const lang of Object.keys(languages)){
 const t=s=>tr(s,{},lang),c=document.createElement('canvas');c.width=1200;c.height=630;const ctx=c.getContext('2d');ctx.fillStyle='#eaf1f4';ctx.fillRect(0,0,1200,630);ctx.fillStyle='#fff8ee';ctx.fillRect(28,28,1144,574);ctx.fillStyle='#a9443e';ctx.font='800 72px system-ui';ctx.fillText('HOME',70,175);
 let y=245;for(const [s,size,color]of [['8 个小选择，找到你该住哪里。',28,'#293740'],['小猫挂挂在窗边等你。',25,'#5d6b73']]){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;for(const line of wrapLines(t(s),s=>ctx.measureText(s).width,380,lang)){ctx.fillText(line,70,y);y+=42;}y+=20;}
 ctx.imageSmoothingEnabled=false;ctx.drawImage(image,470,78,672,504);const url=URL.createObjectURL(await new Promise(r=>c.toBlob(r,'image/png'))),a=document.createElement('a'),preview=new Image();a.href=url;a.download=lang==='zh-Hans'?'share-preview.png':`share-preview-${lang}.png`;a.textContent=lang;preview.src=url;preview.alt=t('小猫挂挂在窗边等你。');document.querySelector('#previews').append(a,preview);
}
</script></html>
