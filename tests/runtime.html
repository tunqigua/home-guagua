<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>HOME · 运行验收</title><style>body{font:14px/1.6 system-ui;background:#eaf1f4;color:#293740;padding:20px}pre{white-space:pre-wrap}iframe{width:375px;height:812px;border:1px solid #ccc}img{max-width:240px}#cards{display:flex;flex-wrap:wrap;gap:12px}</style><h1>浏览器运行验收</h1><pre id="status">运行中…</pre><iframe id="frame"></iframe><div id="cards"></div><script type="module">
import {rooms} from '../dist/data.js';
import {KEY,SESSION_KEY,ROOM_KEY,defaultConfig,roomURL} from '../dist/logic.js';
import {createCard} from '../dist/card.js';
import {sceneURI} from '../dist/scene.js';
const frame=document.querySelector('#frame'),out=document.querySelector('#status'),reports=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(value,message)=>{if(!value)throw Error(message);};
const record=t=>{reports.push('✓ '+t);out.textContent=reports.join('\n');};
let sequence=0;
async function load(mode='empty',hash=''){frame.src='./scenario.html?mode='+mode+'&run='+(++sequence)+hash;await new Promise(r=>frame.onload=r);for(let i=0;i<100&&!frame.contentWindow.__qa?.ready;i++)await sleep(20);assert(frame.contentWindow.__qa?.ready,'fixture ready');return frame.contentWindow;}
const button=(w,text)=>[...w.document.querySelectorAll('button')].find(n=>n.textContent===text);
const option=(w,a)=>w.document.querySelector(`[data-answer="${a}"]`);
const index=w=>JSON.parse(w.sessionStorage.getItem(SESSION_KEY)).draft?.index;
const answer=async(w,a)=>{option(w,a).click();await sleep(550);};
try{
 let w=await load();button(w,'去找我的小屋  →').click();await sleep(50);
 assert(index(w)===0,'starts q1');assert(w.__qa.idle.size===1,'one 60s timer');
 option(w,'A').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));assert(index(w)===0,'arrow does not advance');assert(w.document.activeElement.dataset.answer==='B','arrow focuses B');
 option(w,'B').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));option(w,'C').click();await sleep(240);option(w,'D').click();await sleep(340);
 assert(index(w)===1,'no click-through');assert(JSON.parse(w.sessionStorage.getItem(SESSION_KEY)).draft.answers[0]==='B','one answer only');assert(JSON.parse(w.sessionStorage.getItem(SESSION_KEY)).draft.answers[1]===null,'next question remains empty');record('键盘只移动焦点，Enter 前进；连点没有误答下一题');
 button(w,'← 上一题').click();await sleep(30);assert(option(w,'B').getAttribute('aria-checked')==='true','existing answer shown');await answer(w,'B');assert(index(w)===1,'same answer advances');button(w,'← 上一题').click();await sleep(30);await answer(w,'A');assert(index(w)===1,'changed answer advances');record('上一题保留选择，修改答案与再次点击原答案均可继续');
 assert(!w.document.querySelector('.playing'),'not idle at start');assert(w.__qa.idle.size===1,'one timer after navigation');w.__qa.fireIdle();assert(!!w.document.querySelector('.playing'),'idle animation starts');w.dispatchEvent(new w.Event('scroll'));assert(!w.document.querySelector('.playing'),'scroll stops idle');assert(w.__qa.idle.size===1,'scroll resets timer');
 Object.defineProperty(w.document,'hidden',{value:true,configurable:true});w.document.dispatchEvent(new w.Event('visibilitychange'));assert(w.__qa.idle.size===0,'background cancels idle');Object.defineProperty(w.document,'hidden',{value:false,configurable:true});w.document.dispatchEvent(new w.Event('visibilitychange'));assert(w.__qa.idle.size===1,'foreground restarts full timer');record('一分钟触发计时器唯一；滚动停止，后台取消，前台重新计时');
 for(let i=1;i<7;i++)await answer(w,'A');option(w,'D').click();await sleep(240);assert(!!w.document.querySelector('.snow-layer'),'snow only on completion');assert(w.__qa.idle.size===0,'idle cleaned at result');button(w,'跳过').click();assert(!w.document.querySelector('.snow-layer'),'skip cleans snow');
 const stored=JSON.parse(w.sessionStorage.getItem(SESSION_KEY));assert(stored.draft===null,'draft cleared');assert(!JSON.stringify(stored).includes('answers'),'no answers retained');assert(!w.localStorage.getItem(ROOM_KEY),'default no durable room');assert(stored.own.config.items[0]==='tableware','Q8 initial item');record('八题直接完成，厚雪可跳过，清除答案，第八题改变初始小物');
 const original=w.document.querySelector('.scene').src;button(w,'壁炉橘光').click();button(w,'灰绿色').click();const selects=w.document.querySelectorAll('.slots select');selects[0].value='none';selects[0].dispatchEvent(new w.Event('change'));button(w,rooms[stored.own.config.type].plaques[2]).click();const current=JSON.parse(w.sessionStorage.getItem(SESSION_KEY)).own.config;assert(current.type===stored.own.config.type&&current.light==='fire'&&current.curtain==='sage'&&current.items[0]==='none'&&current.plaque===2,'decor applied');assert(original!==w.document.querySelector('.scene').src,'scene changes');assert(w.document.querySelector('.scene').src===sceneURI(current,{key:true}),'screen uses same scene config');record('灯光、窗帘、三个摆件位、门牌话即时修改，不改变结果类型');
 const remember=w.document.querySelector('.remember input');remember.click();assert(!!w.localStorage.getItem(ROOM_KEY),'remember persists');assert(!w.localStorage.getItem(ROOM_KEY).includes('answers'),'remember no answers');remember.click();assert(!w.localStorage.getItem(ROOM_KEY),'off removes durable');record('记住开关生效；关闭删除长期保存，当前小屋仍可使用');
 button(w,'把小屋发给朋友').click();await sleep(30);const url=w.__qa.copies[0];assert(url&&new URL(url).hash.includes('/room/v2/'),'clipboard fallback');const snapshot=new URL(url).hash;const before=w.sessionStorage.getItem(SESSION_KEY);w.location.hash=snapshot;await sleep(40);assert(!w.document.querySelector('.snow-layer'),'shared no reveal');assert(w.document.querySelector('.scene').src===sceneURI(current,{key:true}),'snapshot restores scene');button(w,'蜂蜜暖光').click();assert(w.sessionStorage.getItem(SESSION_KEY)===before,'guest edits isolated');button(w,'回自己的小屋').click();await sleep(40);assert(w.document.querySelector('.scene').src===sceneURI(current,{key:true}),'own state intact');record('分享快照还原准确；访客装扮不覆盖本人小屋，不重复落雪');
 assert(w.__qa.network.length===0,'no fetch/xhr/beacon');assert(w.__qa.errors.length===0,'no runtime errors');assert(w.performance.getEntriesByType('resource').every(r=>r.name.startsWith(location.origin)||r.name.startsWith('data:')),'local resources only');record('不同答案与装扮过程中，无 fetch/XHR/beacon 上传，资源仅来自本站或本地数据');
 button(w,'恢复初始布置').click();assert(JSON.parse(w.sessionStorage.getItem(SESSION_KEY)).own.config.items[0]==='tableware','restore initial');
 button(w,'清除这台浏览器里的小屋记录').click();button(w,'清除小屋记录').click();await sleep(40);assert(!w.sessionStorage.getItem(SESSION_KEY)&&!w.localStorage.getItem(ROOM_KEY),'own records cleared');assert(w.localStorage.getItem('another-app')==='keep'&&w.sessionStorage.getItem('another-app')==='keep','unrelated data retained');record('恢复初始只重置装扮；清除同时删除本站记录并保留其他应用记录');
 w=await load('legacy');assert(!w.localStorage.getItem(KEY),'old removed');assert(JSON.parse(w.sessionStorage.getItem(SESSION_KEY)).draft.answers[0]==='B','old draft preserved');assert(JSON.parse(w.sessionStorage.getItem(SESSION_KEY)).own.config.type==='cinema','old result preserved');record('真实浏览器旧记录迁移：保留草稿与结果、删除原长期答案');
 w=await load('empty','#/room/v1/charging');assert(w.document.querySelector('h1').textContent==='低电量小窝','old link works');button(w,'我也找一间小屋').click();await sleep(30);assert(index(w)===0,'visitor directly to q1');record('旧房型分享链接兼容，新访客直接进入第一题');
 for(const mode of ['shareok','sharecancel','shareerror','copyfail']){w=await load(mode,'#/result');button(w,'把小屋发给朋友').click();await sleep(30);if(mode==='sharecancel')assert(!w.document.querySelector('dialog').open&&!w.__qa.copies.length,'cancel quiet');if(mode==='shareok')assert(w.__qa.shared.length===1,'native payload');if(mode==='shareerror')assert(w.__qa.copies.length===1,'native error copies');if(mode==='copyfail')assert(w.document.querySelector('dialog textarea').value.includes('/room/v2/'),'manual link');}record('系统分享成功、取消、失败及复制失败的手动后备均通过模拟');
 w=await load('storage');button(w,'去找我的小屋  →').click();await sleep(30);for(let i=0;i<8;i++)await answer(w,'B');assert(!!w.document.querySelector('.dressing'),'works without any storage');record('session/local 存储全部拒绝时，仍可在内存答完与装扮');
 w=await load('imagefail','#/result');button(w,'保存我的小屋').click();await sleep(300);assert(!w.document.querySelector('dialog').open,'failure no success dialog');assert(w.document.querySelector('#notice').textContent.includes('没有生成成功'),'image failure message');button(w,'壁炉橘光').click();assert(w.document.querySelector('.dressing'),'image failure does not break dressing');record('PNG 失败没有假成功提示，装扮继续可用');
 w=await load();button(w,'去找我的小屋  →').click();await sleep(30);option(w,'A').click();w.location.hash='#/';await sleep(300);assert(index(w)===0,'departure cancels pending advance');assert(w.__qa.idle.size===0,'departure cancels idle');button(w,'接着找我的小屋  →').click();await sleep(30);for(let i=0;i<8;i++)await answer(w,'D');await sleep(1000);assert(!w.document.querySelector('.snow-layer')&&w.document.querySelector('.scene').complete,'natural reveal cleans snow');w.dispatchEvent(new w.HashChangeEvent('hashchange'));assert(!w.document.querySelector('.snow-layer'),'result rerender does not replay');record('离开时取消待跳题任务；自然落雪完成无残留，重复打开结果不重播');
 for(const width of [320,375,768]){frame.style.width=width+'px';await sleep(30);assert(w.innerWidth===width,'responsive fixture width');assert(w.document.documentElement.scrollWidth===width,'no horizontal overflow '+width);assert([...w.document.querySelectorAll('button,select')].every(n=>n.getBoundingClientRect().right<=width),'controls fit '+width);}frame.style.width='375px';record('320 / 375 / 768px 实际布局无横向溢出，所有控件位于画面内');
 for(const mode of ['support','supportbroken']){w=await load(mode,'#/result');await sleep(100);assert(!!button(w,'请一杯热可可')===(mode==='support'),'support config gate');}record('赞赏码仅在已配置且图片实际可加载时显示');

 w=await load('reduced');button(w,'去找我的小屋  →').click();await sleep(30);for(let i=0;i<8;i++)await answer(w,'C');assert(!w.document.querySelector('.snow-layer'),'reduced no reveal');record('减少动态效果模式直接展示结果，功能完整');
 const cardHashes=new Set();for(const type of Object.keys(rooms)){const c={...defaultConfig(type),light:'fire',curtain:'sage',items:['plant','books','lamp'],plaque:2};const {blob,width,height,textEnd}=await createCard(c);assert(blob.type==='image/png'&&width===1080&&height>=1440&&textEnd<height-40,'PNG valid '+type);const image=new Image();image.src=URL.createObjectURL(blob);image.alt=rooms[type].name;await image.decode();assert(image.naturalWidth===1080&&image.naturalHeight===height,'decoded size');document.querySelector('#cards').append(image);cardHashes.add(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()).then(b=>[...new Uint8Array(b)].join(',')));}assert(cardHashes.size===8,'all cards distinct');record('八种 1080 × 1440 PNG 实际生成解码，当前装扮与第三句门牌完整导出');
 record('全部运行验收通过');out.dataset.result='passed';
}catch(e){out.textContent+='\n✗ '+e.stack;out.dataset.result='failed';}
</script></html>
