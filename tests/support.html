<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>自愿赞赏 · 本地验收</title>
<style>body{font:14px/1.8 system-ui;margin:20px;background:#eaf1f4;color:#293740}pre{white-space:pre-wrap}iframe{width:375px;height:760px;border:1px solid #aaa}a{color:inherit}</style>
<h1>自愿赞赏 · 本地验收</h1><pre id="out">正在检查…</pre><iframe title="实际小屋应用"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#out'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(ok,message)=>{if(!ok)throw Error(message);},record=t=>out.textContent+='\n✓ '+t;
const button=(w,t)=>[...w.document.querySelectorAll('button')].find(n=>n.textContent===t);
let sequence=0;
async function load(mode='support',hash='#/result'){frame.src='./scenario.html?mode='+mode+'&run='+(++sequence)+hash;await new Promise(r=>frame.onload=r);const w=frame.contentWindow;for(let n=0;n<200&&!w.__qa?.ready;n++)await sleep(20);assert(w.__qa?.ready,'app loaded');await sleep(120);return w;}
try{
 out.textContent='';let w;
 for(const mode of ['supportdisabled','supportempty','supportbroken','supportexternal']){w=await load(mode);assert(!w.document.querySelector('.support'),mode+' hides entry');assert(!!w.document.querySelector('.dressing')&&!button(w,'保存我的小屋').disabled,'free tools still enabled');assert(w.performance.getEntriesByType('resource').every(r=>!r.name.includes('example.invalid')),'external image not requested');}record('未配置、关闭、图片失败或第三方图片均隐藏支持入口；免费功能保留');
 w=await load('support','#/');assert(!w.document.querySelector('.support'),'no home support');w.location.hash='#/quiz';await sleep(40);assert(!w.document.querySelector('.support'),'no quiz support');record('首页及答题过程中没有支持入口或自动弹窗');
 w=await load();let d=w.document;const box=d.querySelector('.support');assert(box===d.querySelector('.result').lastElementChild,'support follows complete experience');for(const selector of ['.actions','.dressing','.reading'])assert(d.querySelector(selector).compareDocumentPosition(box)&4,'order '+selector);assert(!d.querySelector('dialog').open,'never auto opens');record('支持区域位于完整结果、保存分享、装扮之后；不会自动打开');
 const before=w.sessionStorage.getItem('brain-room:v2:session'),writes=w.__qa.writes.length;
 button(w,'请一杯热可可').click();const dialog=d.querySelector('dialog');assert(dialog.open,'opens');assert(d.querySelector('#dialog-title').textContent==='给这个小角落添一点暖','title');assert(d.querySelector('.support-thanks').hidden&&!d.querySelector('.thanking'),'open is not thanks or payment');
 const image=d.querySelector('.support-code');await image.decode();const style=w.getComputedStyle(image);assert(image.naturalWidth===1152&&image.naturalHeight===1152,'original image dimensions');assert(style.objectFit==='contain'&&Math.abs(image.width/image.height-1)<.01,'image not cropped');if(w.CSS.supports('-webkit-touch-callout','default'))assert(style.getPropertyValue('-webkit-touch-callout')==='default','long press allowed');
 const links=[...d.querySelectorAll('.support-image-actions a')];assert(links.length===2&&links.every(a=>a.href===image.src),'original and save use original file');assert(links[0].target==='_blank'&&links[1].hasAttribute('download'),'view and download');assert(![...dialog.querySelectorAll('button')].some(b=>/[136] 元/.test(b.textContent)),'amount references are text');assert(!dialog.querySelector('input,textarea,select'),'no personal data collection');record('原始 1152 × 1152 赞赏图完整展示；可查看与保存原图，金额仅为文字');
 for(const width of [320,375,768]){frame.style.width=width+'px';await sleep(20);assert(d.documentElement.scrollWidth===width,'no overflow '+width);assert(image.getBoundingClientRect().right<=width,'code fits '+width);}frame.style.width='375px';record('320 / 375 / 768px 布局不横向溢出，赞赏图保持完整比例');
 button(w,'看看挂挂的感谢').click();assert(!d.querySelector('.support-thanks').hidden&&d.querySelector('.thanking'),'manual thanks');assert(d.querySelectorAll('.cocoa-hold').length===1,'holds cocoa');const motions=[...d.querySelectorAll('.cocoa-hold,.scarf-tail,.cat-tail,.thanks-warmth')];assert(motions.every(n=>w.getComputedStyle(n).animationDuration==='1.8s'),'1.8 second animation');assert(motions.every(n=>w.getComputedStyle(n).animationIterationCount==='1'),'no infinite loops');button(w,'跳过动画').click();assert(!d.querySelector('.thanking')&&button(w,'跳过动画').hidden,'skip ends motion');assert(!d.querySelector('.support-thanks').hidden,'static thank you remains');record('感谢仅主动播放；捧杯、围巾、两次摆尾及暖窗动画长 1.8 秒，可跳过');
 button(w,'返回赞赏码').click();button(w,'看看挂挂的感谢').click();await sleep(1950);assert(!d.querySelector('.thanking'),'natural finish');button(w,'关闭').click();await sleep(30);assert(!dialog.open,'can close');button(w,'请一杯热可可').click();assert(d.querySelector('.support-thanks').hidden&&!d.querySelector('.thanking'),'reopen does not infer payment');button(w,'关闭').click();await sleep(30);assert(before===w.sessionStorage.getItem('brain-room:v2:session')&&writes===w.__qa.writes.length,'support never writes state');assert(w.__qa.network.length===0&&w.__qa.errors.length===0,'no network submissions or runtime errors');record('自然结束、关闭、重开均不推断付款；支持流程没有存储写入、上传或运行错误');
 button(w,'壁炉橘光').click();assert(JSON.parse(w.sessionStorage.getItem('brain-room:v2:session')).own.config.light==='fire','still dress');button(w,'把小屋发给朋友').click();await sleep(30);assert(w.__qa.copies.length===1,'still share');button(w,'保存我的小屋').click();for(let n=0;n<100&&!dialog.open;n++)await sleep(30);assert(dialog.querySelector('a[download]'),'still export poster');button(w,'关闭').click();record('未付款、播放或关闭感谢后，装扮、分享与保存海报均可继续');
 w=await load('supportreduced');d=w.document;button(w,'请一杯热可可').click();button(w,'看看挂挂的感谢').click();assert(!d.querySelector('.thanking')&&button(w,'跳过动画').hidden&&!!d.querySelector('.cocoa-hold'),'reduced static cocoa');button(w,'关闭').click();record('减少动态效果模式直接显示捧热可可的静态挂挂，可正常关闭');
 w=await load();d=w.document;button(w,'壁炉橘光').click();button(w,'请一杯热可可').click();d.querySelector('.support-code').dispatchEvent(new Event('error'));await sleep(30);assert(!d.querySelector('.support')&&!d.querySelector('dialog').open,'image error hides support');assert(JSON.parse(w.sessionStorage.getItem('brain-room:v2:session')).own.config.light==='fire','image error preserves dress');record('弹层图片失效时关闭并隐藏入口，保留当前装扮');
 out.dataset.result='passed';record('自愿赞赏全部运行验收通过');
}catch(e){out.dataset.result='failed';out.textContent+='\n✗ '+e.stack;}
</script></html>
